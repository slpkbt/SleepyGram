name: Build SleepyGram

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - macos-windows
          - linux-macos
          - linux-x64
          - macos-arm64
          - windows-x64
          - all
      macos_runner:
        description: macOS arm64 runner image
        type: choice
        default: xcode-27
        options:
          - macos-15
          - macos-26
          - xcode-27
      publish_release:
        description: Publish the signed stable release from protected dev (platform all)
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || secrets.AYUGRAM_API_ID || secrets.TELEGRAM_API_ID || secrets.API_ID || '2040' }}
  TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || secrets.AYUGRAM_API_HASH || secrets.TELEGRAM_API_HASH || secrets.API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
  CI_QT_VERSION: 6.11.2
  CI_MACOS_MINIMUM: '12.0'

jobs:
  preflight:
    name: source preflight
    runs-on: ubuntu-22.04
    outputs:
      production-update: ${{ steps.trust.outputs.production }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check update trust and release request
        id: trust
        shell: bash
        env:
          SLEEPYGRAM_UPDATE_PUBLIC_BUNDLE: ${{ inputs.publish_release && vars.SLEEPYGRAM_UPDATE_PUBLIC_BUNDLE || '' }}
          RELEASE_REQUESTED: ${{ inputs.publish_release }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$RELEASE_REQUESTED" == true ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REPOSITORY" != slpkbt/SleepyGram \
              || "$GITHUB_REF" != refs/heads/dev || "$RELEASE_REF_PROTECTED" != true || "$RELEASE_PLATFORM" != all ]]; then
              echo "::error::Publishing requires a manual dispatch on protected dev with all platforms selected."
              exit 1
            fi
            args+=(--require-production)
          fi
          keys="$RUNNER_TEMP/update-keys"
          python3 .github/ci/update_package.py trust --output "$keys" "${args[@]}"
          openssl pkeyutl -verify -rawin -pubin -inkey "$keys/root-public.pem" \
            -in "$keys/manifest.min.json" -sigfile "$keys/manifest.sig"
          if [[ -n "$SLEEPYGRAM_UPDATE_PUBLIC_BUNDLE" ]]; then
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test signed update release checks
        run: python3 .github/ci/update_test.py
      - name: Test Linux update recovery before the platform builds
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qt6-base-dev libssl-dev liblzma-dev zlib1g-dev
          git submodule update --init -- Telegram/lib_base
          cmake -S .github/ci/update-native -B "$RUNNER_TEMP/update-native" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/update-native" --parallel 2 --target Updater
          python3 tools/tests/test_sleepy_updater.py --helper "$RUNNER_TEMP/update-native/Updater"
      - name: Test chat PIN entry
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -I Telegram/SourceFiles tools/tests/test_chat_pin_input.cpp -o "$RUNNER_TEMP/chat-pin-input"
          "$RUNNER_TEMP/chat-pin-input"
      - name: Test reminder capacity
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -I Telegram/SourceFiles tools/tests/test_reply_later_capacity.cpp -o "$RUNNER_TEMP/reply-later-capacity"
          "$RUNNER_TEMP/reply-later-capacity"
      - name: Test language key preflight
        run: python3 .github/ci/test_preflight_lang.py
      - name: Test build diagnostics
        run: python3 .github/ci/test_build_diagnostics.py
      - name: Test build manifest
        run: python3 .github/ci/test_build_artifact.py
      - name: Test packaged startup checks
        run: python3 .github/ci/test_smoke.py
      - name: Test emergency action fixtures
        run: python3 tools/tests/test_emergency_actions.py
      - name: Test macOS Qt cache pruning
        run: python3 .github/ci/test_prune_macos_qt_sources.py
      - name: Test macOS Swift runtime packaging
        run: python3 .github/ci/test_macos_swift_runtime.py
      - name: Check language forms and subset keys
        run: python3 .github/ci/preflight_lang.py Telegram/Resources/langs/lang.strings

  linux-x64:
    name: linux-x64
    runs-on: ubuntu-22.04
    needs: preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'linux-macos' || inputs.platform == 'linux-x64' || inputs.platform == 'all' }}
    env:
      IMAGE_TAG: sleepygram:centos_env
    steps:
      - name: Check API credentials
        shell: bash
        run: |
          if [[ -z "$TDESKTOP_API_ID" || -z "$TDESKTOP_API_HASH" ]]; then
            echo "::error::Missing API credentials. Configure TDESKTOP_API_ID and TDESKTOP_API_HASH or the supported Telegram aliases."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync AyuGram submodules
        run: python3 Telegram/build/sync_ayu_submodules.py

      - name: Prepare Dockerfile
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE="$(DEBUG= LTO= poetry run gen_dockerfile)"
          printf '%s\n' "$DOCKERFILE" > Dockerfile

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Install Linux startup test dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends xvfb x11-utils
          command -v Xvfb
          command -v xdpyinfo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache key inputs
        id: cache-key
        run: python3 .github/ci/build_artifact.py cache-key --platform linux-x64 --repo-root .

      - name: Cache Docker layers
        id: linux-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: linux-x64-buildx-${{ steps.cache-key.outputs.key }}
          restore-keys: linux-x64-buildx-

      - name: Prepare libraries
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          rm -rf "$RUNNER_TEMP/.buildx-cache"
          mv "$RUNNER_TEMP/.buildx-cache-new" "$RUNNER_TEMP/.buildx-cache"

      - name: Save Docker layers
        if: steps.linux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: linux-x64-buildx-${{ steps.cache-key.outputs.key }}

      - name: Record build image
        shell: bash
        run: |
          image_id="$(docker image inspect --format='{{.Id}}' "$IMAGE_TAG")"
          cmake_version="$(docker run --rm --network none "$IMAGE_TAG" cmake --version | head -n 1)"
          compiler_version="$(docker run --rm --network none "$IMAGE_TAG" c++ --version | head -n 1)"
          docker run --rm --network none "$IMAGE_TAG" /usr/bin/python3.11 -c 'import xml.parsers.expat'
          {
            echo "CI_CONTAINER_IMAGE=$image_id"
            echo "CI_CONTAINER_CMAKE=$cmake_version"
            echo "CI_CONTAINER_CXX=$compiler_version"
          } >> "$GITHUB_ENV"

      - name: Prepare public update trust
        env:
          SLEEPYGRAM_UPDATE_PUBLIC_BUNDLE: ${{ inputs.publish_release && vars.SLEEPYGRAM_UPDATE_PUBLIC_BUNDLE || '' }}
        run: python3 .github/ci/update_package.py trust --output "$RUNNER_TEMP/update-keys"

      - name: Build
        id: build
        env:
          PRODUCTION_UPDATE: ${{ needs.preflight.outputs.production-update }}
          KEEP_GOING: "1"
        run: |
          update_keys=""
          if [[ "$PRODUCTION_UPDATE" == true ]]; then
            update_keys=/update-keys
          fi
          python3 .github/ci/build_diagnostics.py \
            --log-file "$RUNNER_TEMP/linux-x64-build.log" -- docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$RUNNER_TEMP/update-keys:/update-keys:ro" \
            -e CONFIG=Release \
            -e KEEP_GOING="$KEEP_GOING" \
            "$IMAGE_TAG" \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              -D CMAKE_CONFIGURATION_TYPES=Release \
              -D Python3_EXECUTABLE=/usr/bin/python3.11 \
              -D TDESKTOP_API_ID="$TDESKTOP_API_ID" \
              -D TDESKTOP_API_HASH="$TDESKTOP_API_HASH" \
              -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
              -D SLEEPYGRAM_ENABLE_RELEASE_UPDATE=ON \
              -D TDESKTOP_BUILD_UPDATE_TESTS=ON \
              -D SLEEPYGRAM_UPDATE_KEYS_DIR="$update_keys" \
              -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Upload failed build logs
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-linux-x64
          path: ${{ runner.temp }}/linux-x64-build.log
          if-no-files-found: ignore

      - name: Verify protected profile storage
        run: |
          docker run --rm -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" -v "$RUNNER_TEMP/update-keys:/update-keys:ro" "$IMAGE_TAG" \
            cmake --build /usr/src/tdesktop/out --config Release --parallel 2 --target check_revocable_profiles

      - name: Verify release parser on Linux
        run: |
          docker run --rm -u "$(id -u)" -w /usr/src/tdesktop \
            -v "$PWD:/usr/src/tdesktop" -v "$RUNNER_TEMP/update-keys:/update-keys:ro" "$IMAGE_TAG" \
            bash -ec 'cmake --build out --config Release --parallel 2 --target test_update_github && out/Release/test_update_github'

      - name: Verify signed update and rollback on Linux
        if: needs.preflight.outputs.production-update != 'true'
        run: |
          docker run --rm --network none -u "$(id -u)" -w /usr/src/tdesktop \
            -v "$PWD:/usr/src/tdesktop:ro" "$IMAGE_TAG" \
            /usr/bin/python3.11 tools/tests/test_sleepy_updater.py --helper out/Release/Updater

      - name: Package and verify
        id: package
        shell: bash
        run: |
          set -euo pipefail
          app="out/Release/SleepyGram"
          test -f "$app"
          readelf -h "$app" | grep -Eq 'Machine:.*Advanced Micro Devices X86-64' || {
            echo "::error::SleepyGram is not an x86_64 ELF executable"
            exit 1
          }
          package="$RUNNER_TEMP/sleepygram-linux-x64"
          mkdir -p "$package"
          cp "$app" "$package/SleepyGram"
          readelf -h out/Release/SleepyGramRemovalHelper | grep -Eq 'Machine:.*Advanced Micro Devices X86-64'
          cp out/Release/SleepyGramRemovalHelper "$package/"
          cp Telegram/SourceFiles/ayu/libs/sqlite/LICENSE-SQLCipher.txt "$package/"
          readelf -h out/Release/Updater | grep -Eq 'Machine:.*Advanced Micro Devices X86-64'
          cp out/Release/Updater "$package/"
          files=(SleepyGram SleepyGramRemovalHelper Updater LICENSE-SQLCipher.txt)
          python3 .github/ci/build_artifact.py create \
            --platform linux-x64 \
            --repo-root . \
            --build-dir out/Release \
            --output "$package/build-manifest.json" \
            --qt-version "$CI_QT_VERSION" \
            --container-image "$CI_CONTAINER_IMAGE"
          files+=(build-manifest.json)
          tar -C "$package" -cJf "$RUNNER_TEMP/SleepyGram-linux-x64.tar.xz" "${files[@]}"
          python3 .github/ci/build_artifact.py verify-package \
            --platform linux-x64 \
            --archive "$RUNNER_TEMP/SleepyGram-linux-x64.tar.xz"

      - name: Startup smoke
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          extracted="$RUNNER_TEMP/sleepygram-linux-x64-extracted"
          mkdir -p "$extracted"
          tar -xJf "$RUNNER_TEMP/SleepyGram-linux-x64.tar.xz" -C "$extracted"
          display_file="$RUNNER_TEMP/sleepygram-xvfb-display"
          xvfb_log="$RUNNER_TEMP/sleepygram-xvfb.log"
          Xvfb -displayfd 3 -screen 0 1024x768x24 -nolisten tcp -noreset -ac \
            3>"$display_file" >"$xvfb_log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..100}; do
            kill -0 "$xvfb_pid" 2>/dev/null || break
            display_number=$(cat "$display_file")
            if [[ "$display_number" =~ ^[0-9]+$ && -S "/tmp/.X11-unix/X$display_number" ]] \
              && xdpyinfo -display ":$display_number" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [[ "$ready" != true ]]; then
            cat "$xvfb_log"
            echo "::error::The Linux startup test could not start an X11 display."
            exit 1
          fi
          docker run --rm --network none \
            -u "$(id -u)" \
            -e "DISPLAY=:$display_number" \
            -v /tmp/.X11-unix:/tmp/.X11-unix:ro \
            -v "$PWD:/usr/src/tdesktop:ro" \
            -v "$extracted:/package:ro" \
            "$IMAGE_TAG" \
            python3 /usr/src/tdesktop/.github/ci/smoke.py \
              --platform linux-x64 --directory /package --qpa-platform xcb --require-startup

      - name: Save package for startup diagnosis
        if: ${{ failure() && steps.package.outcome == 'success' && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-linux-startup
          path: |
            ${{ runner.temp }}/SleepyGram-linux-x64.tar.xz
            ${{ runner.temp }}/sleepygram-xvfb.log
          retention-days: 3

      - name: Prepare unsigned Linux update
        run: |
          docker run --rm --network none -u "$(id -u)" -w /usr/src/tdesktop \
            -v "$PWD:/usr/src/tdesktop:ro" -v "$RUNNER_TEMP:/package" "$IMAGE_TAG" \
            /usr/bin/python3.11 .github/ci/update_package.py pack \
              --platform linux-x64 --packer out/Release/Packer --keys /package/update-keys \
              --stage /package/sleepygram-linux-x64 --output /package \
              --archive /package/SleepyGram-linux-x64.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: |
            ${{ runner.temp }}/SleepyGram-linux-x64.tar.xz
            ${{ runner.temp }}/SleepyGram-update-linux-x64.tdup.unsigned
            ${{ runner.temp }}/SleepyGram-update-linux-x64.tdup.signing-input
          if-no-files-found: error
          compression-level: 0

  macos-prepare:
    name: macos-prepare
    runs-on: ${{ inputs.macos_runner || 'xcode-27' }}
    timeout-minutes: 360
    needs: preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'macos-windows' || inputs.platform == 'linux-macos' || inputs.platform == 'macos-arm64' || inputs.platform == 'all' }}
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      artifact-name: ${{ steps.archive-deps.outputs.name }}
    env:
      TDESKTOP_API_ID: ""
      TDESKTOP_API_HASH: ""
    steps:
      - name: Verify Apple Silicon runner
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::macOS runner must be arm64, got $(uname -m)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: Sync AyuGram submodules
        run: python3 tdesktop/Telegram/build/sync_ayu_submodules.py

      - name: Install tools
        run: |
          sudo chown -R "$(whoami):admin" /usr/local/share || true
          brew update
          brew install automake cmake gnu-tar libtool meson nasm ninja pkg-config wget
          sudo mdutil -a -i off || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake || true

      - name: Test macOS permission wrapper
        run: python3 tdesktop/tools/tests/test_mac_permissions.py

      - name: Cache key inputs
        id: cache-key
        run: python3 tdesktop/.github/ci/build_artifact.py cache-key --platform macos-arm64 --repo-root tdesktop

      - name: Cache libraries
        id: mac-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: macos-arm64-libraries-v2-${{ steps.cache-key.outputs.key }}
          restore-keys: macos-arm64-libraries-v2-

      - name: Prepare libraries
        id: prepare
        if: steps.mac-cache.outputs.cache-hit != 'true'
        env:
          QT: ${{ env.CI_QT_VERSION }}
          SLEEPYGRAM_MAC_TG_OWT_ARM64_RELEASE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            AUTH_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          fi
          python3 tdesktop/.github/ci/build_diagnostics.py --log-file "$RUNNER_TEMP/macos-arm64-prepare.log" -- bash ./tdesktop/Telegram/build/prepare/mac.sh silent

      - name: Prune macOS Qt build sources
        id: mac-qt-prune
        if: ${{ steps.prepare.outcome != 'failure' }}
        continue-on-error: true
        run: python3 tdesktop/.github/ci/prune_macos_qt_sources.py --libraries Libraries --qt-version "$CI_QT_VERSION"

      - name: Report compact dependency footprint
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        continue-on-error: true
        run: |
          echo "Dependency cache footprint before save (uncompressed):"
          du -sh Libraries ThirdParty

      - name: Save macOS dependencies
        if: steps.mac-cache.outputs.cache-hit != 'true' && steps.mac-qt-prune.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: macos-arm64-libraries-v2-${{ steps.cache-key.outputs.key }}

      - name: Archive cold macOS dependencies
        id: archive-deps
        if: ${{ steps.mac-cache.outputs.cache-hit != 'true' && steps.prepare.outcome == 'success' && steps.mac-qt-prune.outcome == 'success' }}
        continue-on-error: true
        run: |
          echo "name=macos-arm64-dependencies-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          gtar --use-compress-program='gzip -1' -cf "$RUNNER_TEMP/macos-arm64-dependencies.tar.gz" Libraries ThirdParty

      - name: Upload cold macOS dependencies
        id: upload-deps
        if: ${{ steps.archive-deps.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive-deps.outputs.name }}
          path: ${{ runner.temp }}/macos-arm64-dependencies.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload dependency preparation diagnostics
        if: ${{ failure() && steps.prepare.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-macos-arm64-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-arm64-prepare.log
          if-no-files-found: ignore

  macos-arm64:
    name: macos-arm64
    runs-on: ${{ inputs.macos_runner || 'xcode-27' }}
    timeout-minutes: 360
    needs:
      - preflight
      - macos-prepare
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'macos-windows' || inputs.platform == 'linux-macos' || inputs.platform == 'macos-arm64' || inputs.platform == 'all' }}
    steps:
      - name: Verify Apple Silicon runner
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::macOS runner must be arm64, got $(uname -m)"
            exit 1
          fi

      - name: Check API credentials
        run: |
          if [ -z "$TDESKTOP_API_ID" ] || [ -z "$TDESKTOP_API_HASH" ]; then
            echo "::error::Missing API credentials. Configure TDESKTOP_API_ID and TDESKTOP_API_HASH or the supported Telegram aliases."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop

      - name: Sync AyuGram submodules
        run: python3 tdesktop/Telegram/build/sync_ayu_submodules.py

      - name: Install tools
        run: |
          sudo chown -R "$(whoami):admin" /usr/local/share || true
          brew update
          brew install automake cmake gnu-tar libtool meson nasm ninja pkg-config wget
          sudo mdutil -a -i off || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake || true

      - name: Test macOS permission wrapper
        run: python3 tdesktop/tools/tests/test_mac_permissions.py

      - name: Cache key inputs
        id: cache-key
        run: python3 tdesktop/.github/ci/build_artifact.py cache-key --platform macos-arm64 --repo-root tdesktop

      - name: Cache libraries
        id: mac-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: macos-arm64-libraries-v2-${{ steps.cache-key.outputs.key }}

      - name: Download cold macOS dependencies
        id: download-deps
        if: ${{ steps.mac-cache.outputs.cache-hit != 'true' && needs.macos-prepare.outputs.cache-key == steps.cache-key.outputs.key && needs.macos-prepare.outputs.artifact-name != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.macos-prepare.outputs.artifact-name }}
          path: ${{ runner.temp }}/macos-arm64-dependencies

      - name: Restore cold macOS dependencies
        id: restore-cold-deps
        if: ${{ steps.download-deps.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/macos-arm64-dependencies/macos-arm64-dependencies.tar.gz"
          trap 'rm -f "$archive"' EXIT
          gtar -xzf "$archive"
          test -d Libraries
          test -d ThirdParty

      - name: Prepare libraries after cache or artifact miss
        id: prepare-fallback
        if: ${{ steps.mac-cache.outputs.cache-hit != 'true' && steps.restore-cold-deps.outcome != 'success' }}
        env:
          QT: ${{ env.CI_QT_VERSION }}
          SLEEPYGRAM_MAC_TG_OWT_ARM64_RELEASE: "1"
        run: |
          rm -rf Libraries ThirdParty
          python3 tdesktop/.github/ci/build_diagnostics.py --log-file "$RUNNER_TEMP/macos-arm64-prepare.log" -- bash ./tdesktop/Telegram/build/prepare/mac.sh silent

      - name: Prune macOS Qt build sources
        id: mac-qt-prune
        continue-on-error: true
        run: python3 tdesktop/.github/ci/prune_macos_qt_sources.py --libraries Libraries --qt-version "$CI_QT_VERSION"

      - name: Free up library build intermediates
        id: cleanup-libraries
        run: |
          find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path 'Libraries/local/src/wallet_engine/wallet_engine.cpp' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Prepare public update trust
        env:
          SLEEPYGRAM_UPDATE_PUBLIC_BUNDLE: ${{ inputs.publish_release && vars.SLEEPYGRAM_UPDATE_PUBLIC_BUNDLE || '' }}
        run: python3 tdesktop/.github/ci/update_package.py trust --output "$RUNNER_TEMP/update-keys" --repo-root tdesktop

      - name: Configure macOS app
        id: configure
        working-directory: tdesktop
        shell: bash
        env:
          QT: ${{ env.CI_QT_VERSION }}
          PRODUCTION_UPDATE: ${{ needs.preflight.outputs.production-update }}
        run: |
          set -euo pipefail
          update_keys=""
          if [[ "$PRODUCTION_UPDATE" == true ]]; then
            update_keys="$RUNNER_TEMP/update-keys"
          fi
          clang="$(xcrun --sdk macosx --find clang)"
          clangxx="$(xcrun --sdk macosx --find clang++)"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          if [[ ! -x "$clang" || ! -x "$clangxx" || ! -d "$sdk" ]]; then
            echo "::error::xcrun did not resolve usable Clang compilers and a macOS SDK."
            exit 1
          fi
          cmake --version
          ninja --version
          "$clang" --version
          printf 'macOS SDK: %s\n' "$sdk"
          python3 .github/ci/build_diagnostics.py \
            --log-file "$RUNNER_TEMP/macos-arm64-configure.log" -- \
            cmake -S . -B out -G 'Ninja Multi-Config' \
            -Werror=dev -Werror=deprecated --warn-uninitialized \
            -DCMAKE_CONFIGURATION_TYPES=Release \
            -DCMAKE_C_COMPILER="$clang" -DCMAKE_CXX_COMPILER="$clangxx" \
            -DCMAKE_OBJC_COMPILER="$clang" -DCMAKE_OBJCXX_COMPILER="$clangxx" \
            -DCMAKE_OBJC_FLAGS=-fobjc-weak -DCMAKE_OBJCXX_FLAGS=-fobjc-weak \
            -DCMAKE_OSX_SYSROOT="$sdk" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$CI_MACOS_MINIMUM" \
            -DTDESKTOP_API_ID="$TDESKTOP_API_ID" \
            -DTDESKTOP_API_HASH="$TDESKTOP_API_HASH" \
            -DDESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -DSLEEPYGRAM_ENABLE_RELEASE_UPDATE=ON \
            -DTDESKTOP_BUILD_UPDATE_TESTS=ON \
            -DSLEEPYGRAM_UPDATE_KEYS_DIR="$update_keys" \
            -DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build
        id: build
        working-directory: tdesktop
        env:
          QT: ${{ env.CI_QT_VERSION }}
        run: |
          python3 .github/ci/build_diagnostics.py \
            --log-file "$RUNNER_TEMP/macos-arm64-build.log" -- \
            cmake --build out --config Release --parallel 2 -- -k 0

      - name: Redact CMake configure details
        if: ${{ failure() && (steps.configure.outcome == 'failure' || steps.build.outcome == 'failure') }}
        working-directory: tdesktop
        run: |
          log=out/CMakeFiles/CMakeConfigureLog.yaml
          if [ -f "$log" ]; then
            python3 .github/ci/build_diagnostics.py \
              --log-file "$RUNNER_TEMP/CMakeConfigureLog.yaml" -- cat "$log" >/dev/null
          fi

      - name: Upload failed build logs
        if: ${{ failure() && (steps.prepare-fallback.outcome == 'failure' || steps.mac-qt-prune.outcome == 'failure' || steps.cleanup-libraries.outcome == 'failure' || steps.configure.outcome == 'failure' || steps.build.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-arm64-prepare.log
            ${{ runner.temp }}/macos-arm64-configure.log
            ${{ runner.temp }}/CMakeConfigureLog.yaml
            ${{ runner.temp }}/macos-arm64-build.log
          if-no-files-found: ignore

      - name: Verify protected profile storage
        working-directory: tdesktop
        run: cmake --build out --config Release --parallel 2 --target check_revocable_profiles

      - name: Verify release parser on macOS
        working-directory: tdesktop
        run: |
          cmake --build out --config Release --parallel 2 --target test_update_github
          out/Release/test_update_github

      - name: Verify signed update and rollback on macOS
        if: needs.preflight.outputs.production-update != 'true'
        working-directory: tdesktop
        run: |
          brew install openssl@3
          python3 tools/tests/test_sleepy_updater.py --helper out/Release/Updater \
            --openssl "$(brew --prefix openssl@3)/bin/openssl"

      - name: Package, sign, and verify
        shell: bash
        run: |
          set -euo pipefail
          app="tdesktop/out/Release/SleepyGram.app"
          test -d "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          main="$app/Contents/MacOS/$executable"
          test -f "$main"
          test -f "$app/Contents/Resources/Telegram.rcc"
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")
          test "$icon" = SleepyGram.icns
          cmp "tdesktop/Telegram/Resources/art/$icon" "$app/Contents/Resources/$icon"
          mkdir -p "$app/Contents/Helpers"
          cp tdesktop/out/Release/SleepyGramRemovalHelper "$app/Contents/Helpers/"
          python3 tdesktop/.github/ci/prepare_macos_swift_runtime.py --bundle "$app" --minimum "$CI_MACOS_MINIMUM"
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              archs="$(lipo -archs "$binary")"
              if [[ " $archs " != *" arm64 "* ]]; then
                echo "::error::Mach-O file has no arm64 slice: ${binary#$app/} ($archs)"
                exit 1
              fi
            fi
          done < <(find "$app" -type f -print0)
          main_archs="$(lipo -archs "$main")"
          if [[ "$main_archs" != "arm64" ]]; then
            echo "::error::SleepyGram main executable must be arm64 only, found: $main_archs"
            exit 1
          fi
          cp tdesktop/Telegram/SourceFiles/ayu/libs/sqlite/LICENSE-SQLCipher.txt "$app/Contents/Resources/"
          strip -S -x "$main"
          python3 tdesktop/.github/ci/build_artifact.py create \
            --platform macos-arm64 \
            --repo-root tdesktop \
            --build-dir tdesktop/out/Release \
            --output "$app/Contents/Resources/BuildManifest.json" \
            --qt-version "$CI_QT_VERSION" \
            --macos-bundle "$app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/SleepyGram-macos-arm64.zip"
          version_string="$(sed -nE 's/^[[:space:]]*constexpr auto AppVersionStr = "([0-9.]+)";.*/\1/p' \
            tdesktop/Telegram/SourceFiles/core/version.h)"
          test -n "$version_string"
          python3 tdesktop/.github/ci/build_artifact.py verify-package \
            --platform macos-arm64 \
            --archive "$RUNNER_TEMP/SleepyGram-macos-arm64.zip" \
            --macos-version "$version_string"
          extracted="$RUNNER_TEMP/sleepygram-macos-arm64-extracted"
          mkdir -p "$extracted"
          ditto -x -k "$RUNNER_TEMP/SleepyGram-macos-arm64.zip" "$extracted"
          codesign --verify --deep --strict "$extracted/SleepyGram.app"
          version="$(sed -nE 's/^[[:space:]]*constexpr auto AppVersion = ([0-9]+);.*/\1/p' \
            tdesktop/Telegram/SourceFiles/core/version.h)"
          test -n "$version"
          python3 tdesktop/.github/ci/smoke.py --platform macos-arm64 \
            --directory "$extracted" --qpa-platform cocoa --require-startup \
            --macos-update-probe-version "$version"
          rm -rf "$extracted"

      - name: Create and verify macOS installer
        shell: bash
        run: |
          bash tdesktop/.github/ci/package_macos_dmg.sh \
            tdesktop/out/Release/SleepyGram.app \
            "$RUNNER_TEMP/SleepyGram-macos-arm64.dmg" --smoke

      - name: Prepare unsigned macOS update
        working-directory: tdesktop
        run: |
          python3 .github/ci/update_package.py pack \
            --platform macos-arm64 --packer out/Release/Packer --keys "$RUNNER_TEMP/update-keys" \
            --stage out/Release/SleepyGram.app --output "$RUNNER_TEMP" \
            --archive "$RUNNER_TEMP/SleepyGram-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-macos-arm64
          path: |
            ${{ runner.temp }}/SleepyGram-macos-arm64.zip
            ${{ runner.temp }}/SleepyGram-macos-arm64.dmg
            ${{ runner.temp }}/SleepyGram-macos-arm64.dmg.sha256
            ${{ runner.temp }}/SleepyGram-update-macos-arm64.tdup.unsigned
            ${{ runner.temp }}/SleepyGram-update-macos-arm64.tdup.signing-input
          if-no-files-found: error
          compression-level: 0

  windows-x64:
    name: windows-x64
    runs-on: windows-2022
    needs: preflight
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'macos-windows' || inputs.platform == 'windows-x64' || inputs.platform == 'all' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check API credentials
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TDESKTOP_API_ID) -or [string]::IsNullOrWhiteSpace($env:TDESKTOP_API_HASH)) {
            Write-Error "Missing API credentials. Configure TDESKTOP_API_ID and TDESKTOP_API_HASH or the supported Telegram aliases."
            exit 1
          }

      - name: Prepare directories
        run: |
          $cDrive = [System.IO.DriveInfo]::new('C:\')
          $buildRoot = Join-Path $env:USERPROFILE 'TBuild'
          $dDrive = [System.IO.DriveInfo]::new('D:\')
          $dFree = if ($dDrive.IsReady) { "$([math]::Round($dDrive.AvailableFreeSpace / 1GB)) GiB" } else { 'unavailable' }
          if ($dDrive.IsReady -and $dDrive.DriveType -eq [System.IO.DriveType]::Fixed -and
              $dDrive.AvailableFreeSpace -ge 20GB -and
              $dDrive.AvailableFreeSpace -ge ($cDrive.AvailableFreeSpace + 10GB)) {
            $buildRoot = 'D:\TBuild'
            $buildVolume = 'D'
          } else {
            $buildVolume = 'C'
          }
          Write-Host "C: has $([math]::Round($cDrive.AvailableFreeSpace / 1GB)) GiB free; D: has $dFree available."
          Write-Host "Using $buildRoot for build data."
          if (Test-Path $buildRoot) { throw "Build root already exists: $buildRoot" }
          New-Item -ItemType Directory -Force (Join-Path $buildRoot 'Libraries') | Out-Null
          $workspaceAlias = Join-Path $env:GITHUB_WORKSPACE 'TBuild'
          if (Test-Path $workspaceAlias) { throw "Workspace alias already exists: $workspaceAlias" }
          cmd /c mklink /d "$workspaceAlias" "$buildRoot"
          if ($LASTEXITCODE -ne 0) { throw "Could not create workspace alias to $buildRoot" }
          "TBUILD=$workspaceAlias" >> $env:GITHUB_ENV
          "TBUILD_VOLUME=$buildVolume" >> $env:GITHUB_ENV
          "REPO_PATH=$env:GITHUB_WORKSPACE\TBuild\tdesktop" >> $env:GITHUB_ENV
          "LIBRARIES_PATH=$env:GITHUB_WORKSPACE\TBuild\Libraries\win64" >> $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: TBuild/tdesktop

      - name: Sync AyuGram submodules
        run: python "$env:REPO_PATH\Telegram\build\sync_ayu_submodules.py"

      - name: Read Windows SDK
        run: |
          $doc = Get-Content "$env:REPO_PATH\docs\building-win.md" -Raw
          if ($doc -notmatch 'with \*\*(?<sdk>[^*]+)\*\* SDK version') {
            Write-Error "Could not read Windows SDK version from docs/building-win.md"
            exit 1
          }
          "SDK=$($Matches.sdk)" >> $env:GITHUB_ENV
          "WINDOWS_SDK_VERSION=$($Matches.sdk)" >> $env:GITHUB_ENV

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: Cache key inputs
        id: cache-key
        run: python "$env:REPO_PATH\.github\ci\build_artifact.py" cache-key --platform windows-x64 --repo-root "$env:REPO_PATH"

      - name: Cache ThirdParty
        id: windows-third-party-cache
        uses: actions/cache/restore@v4
        with:
          path: TBuild\ThirdParty
          key: windows-x64-third-party-${{ env.TBUILD_VOLUME }}-${{ steps.cache-key.outputs.key }}

      - name: Cache libraries
        id: windows-libraries-cache
        uses: actions/cache/restore@v4
        with:
          path: TBuild\Libraries\win64
          key: windows-x64-libraries-v2-${{ env.TBUILD_VOLUME }}-${{ steps.cache-key.outputs.key }}

      - name: NuGet sources
        run: |
          $offline = & nuget sources Disable -Name "Microsoft Visual Studio Offline Packages" 2>&1
          $offlineExit = $LASTEXITCODE
          if ($offlineExit -ne 0) {
            Write-Host "Offline NuGet source was not present or could not be disabled."
          }

          $update = & nuget sources Update -Name "nuget.org" -Source "https://api.nuget.org/v3/index.json" 2>&1
          if ($LASTEXITCODE -ne 0) {
            $add = & nuget sources Add -Name "nuget.org" -Source "https://api.nuget.org/v3/index.json" 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Could not configure nuget.org source."
              exit 1
            }
          }

          $enable = & nuget sources Enable -Name "nuget.org" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not enable nuget.org source."
            exit 1
          }

      - name: Prepare libraries
        shell: cmd
        env:
          GYP_MSVS_OVERRIDE_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\
          GYP_MSVS_VERSION: 2022
        run: '%REPO_PATH%\Telegram\build\prepare\win.bat silent'

      - name: Prune Qt build sources
        continue-on-error: true
        run: python "$env:REPO_PATH\.github\ci\prune_windows_qt_sources.py" --libraries "$env:LIBRARIES_PATH" --qt-version "$env:CI_QT_VERSION"

      - name: Save Windows build tools
        if: steps.windows-third-party-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: TBuild\ThirdParty
          key: windows-x64-third-party-${{ env.TBUILD_VOLUME }}-${{ steps.cache-key.outputs.key }}

      - name: Save Windows libraries
        if: steps.windows-libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: TBuild\Libraries\win64
          key: windows-x64-libraries-v2-${{ env.TBUILD_VOLUME }}-${{ steps.cache-key.outputs.key }}

      - name: Prepare public update trust
        working-directory: TBuild/tdesktop
        env:
          SLEEPYGRAM_UPDATE_PUBLIC_BUNDLE: ${{ inputs.publish_release && vars.SLEEPYGRAM_UPDATE_PUBLIC_BUNDLE || '' }}
        run: python .github/ci/update_package.py trust --output "$env:RUNNER_TEMP\update-keys"

      - name: Configure
        id: configure
        working-directory: TBuild/tdesktop
        env:
          QT: ${{ env.CI_QT_VERSION }}
          PRODUCTION_UPDATE: ${{ needs.preflight.outputs.production-update }}
        run: |
          $updateKeys = if ($env:PRODUCTION_UPDATE -eq 'true') { "$env:RUNNER_TEMP\update-keys" } else { '' }
          $compiler = (Get-Command cl.exe -CommandType Application).Source
          if ($compiler -notmatch '\\Hostx64\\x64\\cl\.exe$') {
            throw "Expected the native x64 MSVC compiler: $compiler"
          }
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw 'Ninja is unavailable on this runner' }
          function Configure-WindowsBuild([string]$directory, [string]$keys, [string]$log) {
            python .github/ci/build_diagnostics.py `
              --log-file "$env:RUNNER_TEMP\$log" -- `
              cmake -S . -B $directory -G 'Ninja Multi-Config' `
              -Werror=dev -Werror=deprecated --warn-uninitialized `
              -DCMAKE_CONFIGURATION_TYPES=Release `
              "-DCMAKE_C_COMPILER=$compiler" "-DCMAKE_CXX_COMPILER=$compiler" `
              "-DTDESKTOP_API_ID=$env:TDESKTOP_API_ID" "-DTDESKTOP_API_HASH=$env:TDESKTOP_API_HASH" `
              -DDESKTOP_APP_DISABLE_AUTOUPDATE=OFF `
              -DSLEEPYGRAM_ENABLE_RELEASE_UPDATE=ON `
              -DTDESKTOP_BUILD_UPDATE_TESTS=ON `
              "-DSLEEPYGRAM_UPDATE_KEYS_DIR=$keys" `
              -DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON `
              -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=
            if ($LASTEXITCODE -ne 0) { throw "Windows configure failed for $directory" }
          }
          Configure-WindowsBuild 'out' $updateKeys 'windows-x64-configure.log'
          if ($env:PRODUCTION_UPDATE -eq 'true') {
            Configure-WindowsBuild 'out-update-test' '' 'windows-x64-update-test-configure.log'
          }

      - name: Verify signed update and rollback on Windows
        working-directory: TBuild/tdesktop
        env:
          QT: ${{ env.CI_QT_VERSION }}
          PRODUCTION_UPDATE: ${{ needs.preflight.outputs.production-update }}
        run: |
          $directory = if ($env:PRODUCTION_UPDATE -eq 'true') { 'out-update-test' } else { 'out' }
          cmake --build $directory --config Release --parallel 2 --target Updater Packer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/tests/test_sleepy_updater.py --helper "$directory/Release/Updater.exe" --packer "$directory/Release/Packer.exe" --cc cl
          exit $LASTEXITCODE

      - name: Build
        id: build
        run: |
          python "$env:REPO_PATH\.github\ci\build_diagnostics.py" `
            --log-file "$env:RUNNER_TEMP\windows-x64-build.log" -- `
            cmake --build "$env:REPO_PATH\out" --config Release --parallel 2 -- -k 0
          exit $LASTEXITCODE

      - name: Upload failed build logs
        if: ${{ failure() && (steps.configure.outcome == 'failure' || steps.build.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-windows-x64
          path: |
            ${{ runner.temp }}\windows-x64-configure.log
            ${{ runner.temp }}\windows-x64-update-test-configure.log
            ${{ runner.temp }}\windows-x64-build.log
          if-no-files-found: ignore

      - name: Verify protected profile storage
        run: |
          cmake --build "$env:REPO_PATH\out" --config Release --parallel 2 --target check_revocable_profiles
          exit $LASTEXITCODE

      - name: Verify release parser on Windows
        working-directory: TBuild/tdesktop
        run: |
          cmake --build out --config Release --parallel 2 --target test_update_github
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          out/Release/test_update_github.exe
          exit $LASTEXITCODE

      - name: Package, smoke, and verify
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $out = "$env:REPO_PATH\out\Release"
          $package = Join-Path $env:RUNNER_TEMP "sleepygram-windows-x64"
          $archive = Join-Path $env:RUNNER_TEMP "SleepyGram-windows-x64.zip"
          if (!(Test-Path "$out\SleepyGram.exe")) { throw "Build output is missing SleepyGram.exe" }
          $module = "$out\modules\x64\d3d\d3dcompiler_47.dll"
          function Assert-X64([string]$path) {
            $headers = (& dumpbin.exe /headers $path 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or $headers -notmatch '(?i)8664 machine \(x64\)') {
              throw "Expected an x64 PE image: $path"
            }
          }
          Assert-X64 "$out\SleepyGram.exe"
          Assert-X64 "$out\SleepyGramRemovalHelper.exe"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "$out\SleepyGram.exe" $package
          Copy-Item "$out\SleepyGramRemovalHelper.exe" $package
          Copy-Item "$env:REPO_PATH\Telegram\SourceFiles\ayu\libs\sqlite\LICENSE-SQLCipher.txt" $package
          Assert-X64 "$out\Updater.exe"
          Copy-Item "$out\Updater.exe" $package
          if (Test-Path $module) {
            Assert-X64 $module
            New-Item -ItemType Directory -Force "$package\modules\x64\d3d" | Out-Null
            Copy-Item $module "$package\modules\x64\d3d\d3dcompiler_47.dll"
          }
          python "$env:REPO_PATH\.github\ci\build_artifact.py" create `
            --platform windows-x64 `
            --repo-root "$env:REPO_PATH" `
            --build-dir $out `
            --output "$package\build-manifest.json" `
            --qt-version $env:CI_QT_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Manifest creation failed" }
          Compress-Archive -Path "$package\*" -DestinationPath $archive -Force
          python "$env:REPO_PATH\.github\ci\build_artifact.py" verify-package --platform windows-x64 --archive $archive
          if ($LASTEXITCODE -ne 0) { throw "Windows package validation failed" }
          $extracted = Join-Path $env:RUNNER_TEMP "sleepygram-windows-x64-extracted"
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted -Force
          python "$env:REPO_PATH\.github\ci\smoke.py" --platform windows-x64 --directory $extracted --qpa-platform windows --require-startup
          if ($LASTEXITCODE -ne 0) { throw "Windows startup smoke failed" }

      - name: Prepare unsigned Windows update
        working-directory: TBuild/tdesktop
        run: |
          python .github/ci/update_package.py pack `
            --platform windows-x64 --packer out/Release/Packer.exe --keys "$env:RUNNER_TEMP\update-keys" `
            --stage "$env:RUNNER_TEMP\sleepygram-windows-x64" --output "$env:RUNNER_TEMP" `
            --archive "$env:RUNNER_TEMP\SleepyGram-windows-x64.zip"
          exit $LASTEXITCODE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: |
            ${{ runner.temp }}\SleepyGram-windows-x64.zip
            ${{ runner.temp }}\SleepyGram-update-windows-x64.tdup.unsigned
            ${{ runner.temp }}\SleepyGram-update-windows-x64.tdup.signing-input
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Sign and publish stable release
    runs-on: ubuntu-24.04
    needs:
      - preflight
      - linux-x64
      - macos-arm64
      - windows-x64
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.platform == 'all'
      && github.repository == 'slpkbt/SleepyGram' && github.ref == 'refs/heads/dev' && github.ref_protected
      && needs.preflight.outputs.production-update == 'true'
    permissions:
      contents: write
    environment: sleepygram-release
    concurrency:
      group: sleepygram-stable-release
      cancel-in-progress: false
    env:
      TDESKTOP_API_ID: ""
      TDESKTOP_API_HASH: ""
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets

      - name: Verify artifact source, version, and update bytes
        env:
          SLEEPYGRAM_UPDATE_PUBLIC_BUNDLE: ${{ vars.SLEEPYGRAM_UPDATE_PUBLIC_BUNDLE }}
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/update-keys"
          python3 .github/ci/update_package.py trust --output "$keys" --require-production
          python3 .github/ci/build_artifact.py verify-release \
            --directory release-assets --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python3 .github/ci/update_package.py verify --directory release-assets --keys "$keys"

      - name: Compile standalone Packer from the release commit
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qt6-base-dev liblzma-dev zlib1g-dev libssl-dev
          cmake -S .github/ci/update-native -B "$RUNNER_TEMP/update-native" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/update-native" --parallel 2 --target Packer
          python3 .github/ci/update_test.py --packer "$RUNNER_TEMP/update-native/Packer"

      - name: Sign and verify with the client verifier
        env:
          SLEEPYGRAM_UPDATE_STABLE_KEY_PEM: ${{ secrets.SLEEPYGRAM_UPDATE_STABLE_KEY_PEM }}
        run: |
          python3 .github/ci/update_release.py sign --directory release-assets \
            --keys "$RUNNER_TEMP/update-keys" --packer "$RUNNER_TEMP/update-native/Packer"

      - name: Upload to draft, verify assets, and publish as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/update_release.py publish --directory release-assets
